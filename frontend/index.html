    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('🚀 [CarLog PWA] Service Worker activo y registrado:', reg.scope);
            })
            .catch((err) => {
              console.warn('⚠️ [CarLog PWA] Error registrando Service Worker:', err);
            });
        });
      }
    </script>
